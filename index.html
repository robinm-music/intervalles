<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>intervalles</title>
  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    const supabase = createClient('https://cmcjjttrvuqndtfbkivu.supabase.co', 'sb_publishable_mDhcyM3lbaibgg7UHgWmeQ_zhiGyiVb');
    globalThis.supabase = supabase;
    async function signUpNewUser(email, pwd) {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: pwd,
        // options: {
        //   emailRedirectTo: 'https://example.com/welcome',
        // },
      });
      return { data, error };
    };
    async function signInWithEmail(email, pwd) {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: pwd,
      });
      return { data, error };
    }
    globalThis.signUpNewUser = signUpNewUser;
    globalThis.signInWithEmail = signInWithEmail;
    globalThis.insertUser = async (user, nickname) => {
      let row = {
        user_id: user.id,
        nickname
      };
      return await supabase.from('users').insert(row);
    };
  </script>
