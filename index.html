<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./reset.css" rel="stylesheet" />
  <style>
    body {
      background-color: #b6deda;
      display: flex;
      height: 100%;
      font-family: arial;
    }

    button {
      cursor: pointer;
      padding: 5px 20px;
    }

    .exo {
      margin: auto;
      width: 90%;
      height: 90%;
      border: 2px solid #3e7e51;
      border-radius: 8px;
      padding: 30px;
      background: #00000012;
      color: #392d75;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .answer {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px;
    }

    .answerMask {
      position: absolute;
      height: 0;
    }

    .answer.hidden>.answerMask {
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: #ffffff5e;
      backdrop-filter: blur(2px);
    }

    .explanation {
      position: absolute;
      height: 0;
    }

    .answer.explain>.explanation {
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }
  </style>
  <script>
    'use strict';

    const audio = [];
    const pitches = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
    const startOct = 3;
    const endOct = 6;
    let loaded = 0;
    function load() {
      for (let oct = startOct; oct < endOct; oct++) {
        pitches.forEach(pitch => {
          let audioElt = new Audio('./src/assets/piano-mp3/' + pitch + oct + '.mp3');
          audioElt.addEventListener('canplaythrough', () => {
            ++loaded;
          });
          audio.push(audioElt);
        });
      }
    }
    function play() {
      let interval = Math.random() < 0.5 ? 1 : 2; // Demi-ton ou ton
      let direction = Math.random() < 0.5 ? -1 : 1; // Desc ou asc
      let indice = Math.floor(Math.random() * (audio.length - interval));
      let audioElts = [];
      if (direction === 1) {
        audioElts.push(
          audio[indice],
          audio[indice + interval]
        );
      }
      else {
        indice += interval;
        audioElts.push(
          audio[indice],
          audio[indice - interval]
        );
      }
      audioElts.forEach(elt => {
        elt.pause();
        elt.currentTime = 0;
      });
      audioElts[0].play();
      setTimeout(() => audioElts[1].play(), 500);
      return {
        audioElts,
        interval,
        direction,
      };
    }
    let cur;
    function replay() {
      if (cur) {
        cur.audioElts.forEach(elt => {
          elt.pause();
          elt.currentTime = 0;
        });
        cur.audioElts[0].play();
        setTimeout(() => cur.audioElts[1].play(), 500);
      }
    }
    function answer(elt, a) {
      if (cur) {
        let msg = document.getElementById('msg');
        document.getElementById('answerBloc').classList.add('explain');
        elt.classList.toggle('ok', a === cur.interval);
        elt.classList.toggle('ko', a !== cur.interval);
        if (a === cur.interval) {
          elt.classList.toggle('ok', true);
        }
      }
    }
    window.addEventListener('load', () => {
      load();
      let btn = document.getElementById('playBtn');
      let answerBloc = document.getElementById('answerBloc');
      btn.onclick = () => {
        if (loaded < audio.length - 1)
          return;
        try {
          cur = play();
          /* btn.setAttribute('disabled', true); */
          answerBloc.classList.toggle('hidden', false);
        } catch (e) {
          alert('Error')
        }
      };
    });
  </script>
</head>

<body>
  <!--     <pre id="result">Connecting…</pre> -->
  <div class="exo">
    <h3>Reconnaître les tons et les demi-tons</h3>
    <button id="playBtn">Go !</button>
    <div class="answer hidden" id="answerBloc">
      <div class="answerMask"></div>
      <!-- <div class="explanation"></div> -->
      <div id="msg">Quel est l'interval joué ?</div>
      <!--             <button onclick="javascript:answer(this, 1)">Demi-ton</button>
            <button onclick="javascript:answer(this, 2)">Ton</button> -->
      <button onclick="javascript:replay()">Je ne sais pas : rejoue les notes !</button>
    </div>
  </div>
</body>

</html>
